<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Company Onboarding - JTC Property Services</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
body { font-family: 'Inter', sans-serif; }
.material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.safe-pb { padding-bottom: env(safe-area-inset-bottom); }
</style>
</head>
<body class="bg-[#FBF8FD] text-[#1F3461] antialiased">
<div class="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50">
<div class="w-full max-w-md bg-white rounded-[32px] border border-[#DBD9DE] overflow-hidden shadow-[0px_20px_50px_rgba(31,52,97,0.08)]">
<div class="h-1.5 w-full bg-[#DBD9DE]/30"><div class="h-full bg-[#C9A84C] w-1/4 rounded-r-full transition-all duration-700"></div></div>
<div class="p-10 text-center border-b border-[#F5F3F7]"><h1 class="text-3xl font-bold tracking-tight mb-3">Property Management Platform</h1><p class="text-[#1F3461]/60 text-sm leading-relaxed">Set up your property management workspace.</p></div>
<div class="p-10 space-y-8"><div><h2 class="text-xl font-bold mb-2">Company Details</h2><p class="text-xs text-[#1F3461]/50">Let's start with the basics of your organization.</p></div><div class="space-y-6"><div class="space-y-2"><label class="text-[10px] font-bold uppercase tracking-widest opacity-60">Company Name</label><input type="text" placeholder="e.g. Acme Properties" class="w-full bg-[#F3F4F6] border border-[#DBD9DE] rounded-xl py-4 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-[#1F3461]/5 transition-all"></div><div class="space-y-2"><label class="text-[10px] font-bold uppercase tracking-widest opacity-60">Country</label><div class="relative"><select class="w-full bg-[#F3F4F6] border border-[#DBD9DE] rounded-xl py-4 pl-4 pr-10 text-sm font-medium appearance-none focus:outline-none focus:ring-2 focus:ring-[#1F3461]/5"><option>Select a country</option><option>Malta</option><option>Monaco</option><option>United Kingdom</option></select><span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-[#1F3461]/40 pointer-events-none">expand_more</span></div></div><div class="space-y-2"><label class="text-[10px] font-bold uppercase tracking-widest opacity-60">Corporate Email</label><input type="email" placeholder="contact@company.com" class="w-full bg-[#F3F4F6] border border-[#DBD9DE] rounded-xl py-4 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-[#1F3461]/5 transition-all"></div><div class="space-y-2"><label class="text-[10px] font-bold uppercase tracking-widest opacity-60">Corporate Phone</label><input type="tel" placeholder="+1 (555) 000-0000" class="w-full bg-[#F3F4F6] border border-[#DBD9DE] rounded-xl py-4 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-[#1F3461]/5 transition-all"></div></div></div>
<div class="p-10 bg-[#F5F3F7] border-t border-[#DBD9DE]/50 flex gap-4"><button class="flex-1 bg-transparent border border-[#C9A84C] text-[#1F3461] font-bold text-xs py-5 rounded-2xl tracking-widest uppercase active:bg-white/50 transition-all">Save &<br>Continue Later</button><button class="flex-1 bg-[#1F3461] text-white font-bold text-sm py-5 rounded-2xl flex items-center justify-center gap-2 shadow-lg active:scale-[0.98] transition-all group">Next Step<span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span></button></div>
</div>
<div class="mt-8 flex items-center gap-2 opacity-40"><span class="material-symbols-outlined text-sm">lock</span><p class="text-[10px] font-medium max-w-[240px] text-center">Secure account access and workspace protection.</p></div>
</div>
</body>
</html>
